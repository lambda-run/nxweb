name: ci
on:
  push:
    branches: [main]
  pull_request:

# A push to a PR branch used to start two runs (push and pull_request) on the same commit; branches other than main
# now run once, through their PR, and a newer push cancels the run it supersedes
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# nxnative (the reference this is a port of) is not part of this repository. Tests that compare against it or build
# guests from its headers (nvn.h for the graphics guests, home_quit.h, the layout references, the take-over inventory)
# use a shallow clone beside the checkout when it can be fetched, and print SKIPPED when it is not there.
env:
  NXNATIVE: ${{ github.workspace }}/../nxnative
  NXNATIVE_HOST: ${{ github.workspace }}/../nxnative/dm/host

jobs:
  # fast and browser run once per memory mode, side by side: every runner that goes through tools/modes.mjs runs only
  # NX_MEM's mode, so a run takes about as long as one mode instead of three. The rest run in every entry: rt:browser's page test
  # loads what a64:browser builds, and its prepare hand-off what prepare:browser writes
  fast:
    name: fast (kit, loader, kernel, a64 guests, runtime under Node, fs, hle) (NX_MEM=${{ matrix.mem }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mem: ["32", "64", "64hi"]
    env:
      NX_MEM: ${{ matrix.mem }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clang, lld and the llvm tools (aarch64 target)
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - run: pip install unicorn capstone backports.zstd
      - run: npm ci
      - name: nxnative (reference checkout; the tests that need it skip without it)
        run: (git init -q "$NXNATIVE" && git -C "$NXNATIVE" fetch -q --depth 1 https://github.com/seedds/nxnative "$(cat NXNATIVE_REF)" && git -C "$NXNATIVE" checkout -q FETCH_HEAD) || echo "::warning::nxnative could not be fetched at the pinned commit; the tests that need it are skipped"
      - name: generated files are up to date
        run: npm run kit:check
      # test/guests/out is not in the repository: `npm test` builds the guest corpus first (clang + Unicorn).
      # The shader tests inside it skip: there is no dotnet here.
      - run: npm test
      - run: npm run fs:test
      - run: npm run hle:test
      - run: npm run audio:test

  fuzz:
    name: a64 instruction fuzz against Unicorn
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - run: pip install unicorn capstone backports.zstd
      - run: npm ci
      - run: npm run a64:fuzz

  browser:
    name: browser (headless Chromium, WebGPU on SwiftShader) (NX_MEM=${{ matrix.mem }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mem: ["32", "64", "64hi"]
    env:
      NX_MEM: ${{ matrix.mem }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - run: pip install unicorn capstone backports.zstd
      - run: npm ci
      # The tests launch Playwright's full Chromium build (channel "chromium", new headless mode) with the flags
      # that give WebGPU a software adapter (--enable-unsafe-webgpu --use-vulkan=swiftshader ..., set by the test
      # runners). The version is the one pinned in package.json.
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: nxnative (reference checkout; the tests that need it skip without it)
        run: (git init -q "$NXNATIVE" && git -C "$NXNATIVE" fetch -q --depth 1 https://github.com/seedds/nxnative "$(cat NXNATIVE_REF)" && git -C "$NXNATIVE" checkout -q FETCH_HEAD) || echo "::warning::nxnative could not be fetched at the pinned commit; the tests that need it are skipped"
      - name: the guest corpus (test/guests/out is not in the repository)
        run: npm run guests:build
      - run: npm run a64:browser
      - run: npm run prepare:browser
      - run: npm run rt:browser
      - run: npm run fs:browser
      - run: npm run gfx:test
