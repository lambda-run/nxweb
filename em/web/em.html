<!doctype html><meta charset="utf-8"><title>nxweb · Emscripten runtime</title>
<style>
 body { font: 13px/1.4 system-ui, sans-serif; margin: 12px; background: #111; color: #ddd; }
 #top { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
 #rt { color: #9cf; } #stage { color: #fc6; }
 #wrap { position: relative; display: inline-block; margin-top: 8px; }
 canvas { background: #000; max-width: 100%; display: block; }
 #fps { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.6); padding: 2px 6px; font: 12px monospace; color: #8f8; }
 #log { white-space: pre-wrap; font: 11px monospace; max-height: 40vh; overflow: auto; background: #000; padding: 6px; margin-top: 8px; }
 .red { color: #f66; }
</style>
<div id="top">
  <b>nxweb</b> <span id="stamp"></span> <span id="rt"></span>
  <button id="continue" hidden></button>
  <label>game (.nup): <input type="file" id="fileinput" accept=".nup"></label>
  <span id="stage">choose the game file</span>
</div>
<div id="wrap"><canvas id="screen" width="1280" height="720"></canvas><div id="fps"></div></div>
<div style="color:#888;margin-top:4px">keys: Z = A · X = B · C = X · V = Y · Enter = + · Backspace = − · Q / E = L / R · arrows or WASD = left stick · IJKL = right stick · or a controller</div>
<div id="log"></div>
<script src="em_status.js"></script>
<script src="audio.js"></script><!-- the audio device's page side (web/audio_page.ts): status line, "click for sound" -->
<script>
// The Emscripten runtime's page: nxnative's C under real threads, nxweb's translator, file system, recorder and
// WebGPU replayer. ?ndve=off: without nxweb's stand-in for the movie upscaler (on by default: ?ndve=bypass is accepted too).
// ?fsdirect=1: guest threads call the fs module in their own instance and the owner is asked only for the storage itself
//   (off by default until it has run at game scale once; then the default and ?fsdirect=0 the way back).
// ?vpipe=1: AV1 packets are queued to the decoder and pictures come back in order as they finish (a call does not wait
//   for the picture of its own packet); the decoder is configured without optimizeForLatency.
// ?vdec=hardware: ask WebCodecs for the hardware AV1 decoder (nxweb's glue asks for software).
// ?asyncsubmit=1: a guest thread's nvnQueueSubmitCommands leaves its batch in a ring for the replayer and returns: the
//   recorder's lock is not held while the owner works (off by default until a ride has compared frames).
// ?lockfree=0: every direct NVN call takes the recorder's lock. The default since 2026-11-13: recording commands and
//   builder setters do not take it, those that the static and the
//   dynamic audit let through (tools/gfx_audit.mjs, tools/gfx_dynaudit.mjs; the proof is em/test/gfx_lockfree_test.mts).
// ?skipmovie=1 (A TEST AID, said in the status line): story movies (Dm_*.webm, not the title's) end after their first
//   two clusters, so the way to the first area is not an hour of movie. ?saves=mem: saves end with the page (default:
//   stored in the browser's private file system, so a later run can continue); ?saves=new: the stored saves are deleted first.
// ?fsworker=1: guest threads call the fs module themselves and a dedicated worker reads the game file (owner/fs_worker.ts).
// ?lfaudit=1: the real-call audit: the first 12 real calls of every entry point the dynamic audit left under the lock
//   are watched for writes to the recorder's shared state (the owner's report has the result: lfAudit; tools/lf_real.mjs
//   reads it from a console log). ?lfreal=0: what that audit cleared (owner/lockfree_real.ts) stays under the lock.
// ?gfxcapture=<frames>[@<present>|@draws<n>] (&gfxcapto=<receiver>, default the ?logto= receiver or http://localhost:8082;
//   &gfxcapname=): nxweb's stream capture for the replayer (test/gfx/REPLAY.md), e.g. &gfxcapture=3@draws500.
// ?gfxprofile=0: without the game profile's graphics switches (default since 2026-11-13: on, as nxweb's own page).
// ?shaderwait=0: the call that gives a program its shaders does not wait for them (default: it waits, as nxweb's page).
// ?gfxdirect=0: every NVN call goes to the owner thread (default: guest threads call the recorder in their own instance).
// ?pollpark=N: a thread that only polls (yield, yield, a sleep of microseconds, again and again) parks N microseconds
//   at a time, up to 8 N, until some thread wakes or starts one (default 250; 0 = off: every cycle runs).
// ?handoff=1: nxweb's wake hand-off between cores: a thread that made a thread of better priority ready on another core
//   stands back until that one has blocked (5 ms at most). For the story movie's stall.
// ?coreexcl=1: two guest threads of one virtual core never run at the same time, the one of higher priority first (as on
//   the console; kernel/nx_cores.c). For the A/B of the fault on the title.
// ?cores=1: one running guest thread per virtual core (kernel/nx_cores.c; off by default: it slows loading).
// ?yieldpark=N: a yield that only waits parks up to N microseconds (default 100; 0 = never: yields return at once).
// ?pace=timer: display frames from a message timer, never requestAnimationFrame (a hidden page uses the timer anyway).
// ?logto=<url>: live log and status to a receiver. ?shaderlog=1: the shader store's line per shader. No memory limit
// applies in a browser (the harness's own is for Node in the shared VM, where it can read the process's size).
// ?secs=N: how long the harness runs before it prints its report (default: a day).
// ?auto=1: start at once with the game the nxweb page was last given (its stored file handle), when the browser still
// grants reading it without a click ("allow on every visit").
var RT_KIND = "C/C++ (nxnative) → Emscripten";
var rtLabel = function (threads) { return "rt " + RT_KIND + " · " + (navigator.gpu ? "WebGPU" : "no WebGPU") + " · " + threads + " real threads" + (/[?&]skipmovie=1/.test(location.search) ? " · TEST AID skipmovie=1: story movies are cut short" : ""); };

var lines = [], red = 0;
var feed = [], stopped = "", stamp = "";
var say = function (s) {
  if (!q.get("shaderlog") && /^\[owner\] shader [0-9a-f]+ (arrived|is not in)/.test(s)) return;   // the shader store's line per shader: ?shaderlog=1
  feed.push(s);
  var d = document.createElement("div"); d.textContent = s; if (/\[RED\]/.test(s)) { d.className = "red"; red++; }
  var l = $("log"); l.appendChild(d); if (l.childNodes.length > 600) l.removeChild(l.firstChild); l.scrollTop = l.scrollHeight;
  lines.push(s); if (lines.length > 2000) lines.shift();

};
window.nxem = { lines: lines, state: "idle", reason: "", presents: 0, threads: 0, fps: 0, label: rtLabel(0), red: function () { return red; } };
$("rt").textContent = rtLabel(0);
fetch("build.json").then(function (r) { return r.json(); }).then(function (b) { stamp = "em " + b.rev + " · " + b.built; $("stamp").textContent = stamp; }, function () {});
// ?logto=<url>: new log lines to <url>/append/em.live.log and the status to <url>/em.live.status.json every 3 s (the
// receiver of the nxweb page's ?logto=, /ctl/recv.mjs)

  var u = q.get("logto").replace(/\/$/, ""), n = window.nxem;
  if (feed.length) { var body = feed.join("\n") + "\n"; feed = []; fetch(u + "/append/em.live.log", { method: "POST", body: body }).catch(function () {}); }
  fetch(u + "/em.live.status.json", { method: "POST", body: JSON.stringify({ at: new Date().toISOString(), build: stamp, state: n.state, reason: n.reason, frame: n.presents, fps: Math.round(n.fps * 10) / 10, split: n.frame || null, threads: n.threads, label: n.label, red: red }) }).catch(function () {});
}, 3000);
if (!crossOriginIsolated) say("[RED] page: not cross-origin isolated: no shared memory, the runtime cannot start");
addEventListener("error", function (e) { say("[RED] page error: " + e.message); });
addEventListener("unhandledrejection", function (e) { say("[RED] rejection: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
var started = false;
// The game the nxweb page (same origin) was last given: its FileSystemHandle is in IndexedDB "nxweb-prepare", store
// "handles", key "last" (web/prepare.ts). A file handle is the .nup; a folder handle is searched for one .nup.
var lastHandle = function () { return new Promise(function (res) {
  try { var r = indexedDB.open("nxweb-prepare", 1);
    r.onupgradeneeded = function () { r.result.createObjectStore("handles"); };
    r.onerror = function () { res(null); };
    r.onsuccess = function () { var db = r.result, g;
      try { g = db.transaction("handles").objectStore("handles").get("last"); } catch (e) { db.close(); res(null); return; }
      g.onsuccess = function () { db.close(); res(g.result || null); }; g.onerror = function () { db.close(); res(null); }; };
  } catch (e) { res(null); } }); };
var fileOf = async function (h, ask) {
  if (h.queryPermission && await h.queryPermission({ mode: "read" }) !== "granted") {
    if (!ask || await h.requestPermission({ mode: "read" }) !== "granted") return null;   // asking needs a click
  }
  if (h.kind === "file") return h.getFile();
  for await (const e of h.values()) if (e.kind === "file" && /\.nup$/i.test(e.name)) return e.getFile();
  return null;
};
lastHandle().then(async function (h) {
  if (!h) { if (q.get("auto")) say("[RED] page: ?auto=1, but the nxweb page has stored no game here yet: choose the file once on http://" + location.host + "/ or below"); return; }
  var b = $("continue"); b.textContent = "Continue with " + h.name; b.hidden = false;
  b.onclick = async function () { try { var f = await fileOf(h, true); if (f) start(f); else say("[RED] page: the browser did not give " + h.name + " back: choose the file below"); } catch (e) { say("[RED] page: " + e.message); } };
  if (q.get("auto")) { try { var f = await fileOf(h, false); if (f) start(f); else say("[RED] page: ?auto=1, but reading " + h.name + " needs a click here (the permission is not standing): use the button"); } catch (e) { say("[RED] page: ?auto=1: " + e.message); } }
});
$("fileinput").addEventListener("change", function () { var file = $("fileinput").files[0]; if (file) start(file); });
// ?game=<url>: the game container from a server that answers Range requests (web/game_serve.mjs), for a browser that
// cannot be given a file (a headless one driven over CDP). Read where it lies, range by range; nothing is kept.
if (q.get("game")) (async function () {
  try { var u = q.get("game"), r = await fetch(u, { method: "HEAD" }), n = Number(r.headers.get("X-Size") || r.headers.get("Content-Length"));
    if (!r.ok || !(n > 0)) throw new Error("HTTP " + r.status + ", size " + n);
    say("page: game=" + u + ": the game container is read from that server by ranges (" + (n / 1073741824).toFixed(2) + " GB)");
    start({ remote: true, url: u, size: n, name: u.split("/").pop().split("?")[0] || "game.nup" });
  } catch (e) { say("[RED] page: ?game=: " + e.message); }
})();
function start(file) {
  if (started) return; started = true; $("continue").hidden = true;
  window.nxem.state = "starting";
  window.Module = {
    arguments: ["/exefs", "/rt/translator64.shared.wasm", "/rt/helpers64.shared.wasm", "/rt/loader64.wasm", q.get("secs") || "86400"],
    nxEnv: Object.assign({ NX_CORES: q.get("cores") === "1" ? "1" : "0", NX_COREEXCL: q.get("coreexcl") === "1" ? "1" : "0", NX_WAKE_HANDOFF: q.get("handoff") === "1" ? "1" : "0", NX_VPIPE: q.get("vpipe") === "1" ? "1" : "0" }, q.get("pollpark") !== null ? { NX_POLL_PARK_US: q.get("pollpark") } : {}, q.get("yieldpark") !== null ? { NX_YIELD_PARK_US: q.get("yieldpark") } : {}),
    print: say, printErr: say,
    onAbort: function (w) { say("[RED] abort: " + w); window.nxem.state = "aborted"; if (!window.nxem.reason) Module.nxStopped("abort() in host code: " + w); },
    nxStopped: function (why) { if (window.nxem.reason) return; window.nxem.reason = why; $("stage").textContent = "stopped: " + why; $("stage").style.color = "#f66"; },
    onExit: function (c) { say("EXIT " + c); window.nxem.state = "exited"; },
    nxPage: { file: file, canvas: $("screen"), root: "../", modulesList: ["main", "subsdk0", "sdk"], ndve: q.get("ndve") !== "off", gfxDirect: q.get("gfxdirect") !== "0", gfxLockFree: q.get("lockfree") !== "0", gfxAsync: q.get("asyncsubmit") === "1", vdec: q.get("vdec"), search: location.search, saves: q.get("saves"), gfxProfile: q.get("gfxprofile") !== "0", shaderWait: q.get("shaderwait") !== "0", gfxRealAudit: q.get("lfaudit") === "1", gfxRealPromote: q.get("lfreal") !== "0", skipMovie: q.get("skipmovie") === "1", vpipe: q.get("vpipe") === "1", fsDirect: q.get("fsdirect") === "1" || q.get("fsworker") === "1", fsWorker: q.get("fsworker") === "1", pace: q.get("pace"), stage: function (t) { if (window.nxem.reason) return; $("stage").textContent = t; window.nxem.state = t; } },
  };
  // The runtime (and the owner thread with it) runs in a dedicated worker, em_worker.js; the page keeps the DOM, the
  // input and the audio device. ?owner=page: as it was until 78bdc16, the runtime's main thread is this page's (the
  // title ran at 10-15 frames a second there and at 27-30 in the worker: the page's own tasks delayed every request).
  if (q.get("owner") !== "page") {
    var M1 = window.Module, pg = {}; for (var k1 in M1.nxPage) if (typeof M1.nxPage[k1] !== "function" && k1 !== "file" && k1 !== "canvas") pg[k1] = M1.nxPage[k1];
    window.Module = undefined;
    var off = $("screen").transferControlToOffscreen(), w = new Worker("em_worker.js"); window.nxWorker = w;
    w.onerror = function (e) { say("[RED] worker: " + (e.message || e)); };
    w.onmessage = function (e) { var d = e.data;
      if (d.lines) d.lines.forEach(say);
      if (d.stage !== undefined && !window.nxem.reason) { $("stage").textContent = d.stage; window.nxem.state = d.stage; }
      if (d.stopped) { window.nxem.reason = d.stopped; $("stage").textContent = "stopped: " + d.stopped; $("stage").style.color = "#f66"; }
      if (d.status) { Object.assign(window.nxem, d.status.nxem); window.nxem.label += " · runtime in a worker";
        for (var id in d.status.texts) if ($(id)) $(id).textContent = d.status.texts[id] + (id === "rt" ? " · runtime in a worker" : ""); }

      if (d.mem) { window.wasmMemory = d.mem; var ring = d.audioRing; window.Module = { _nx_audio_ring: function () { return ring; }, _nx_audio_config: function (a, b) { w.postMessage({ call: ["_nx_audio_config", a, b] }); }, _nx_audio_tone: function (a) { w.postMessage({ call: ["_nx_audio_tone", a] }); } }; }
    };
    window.nxInputSink = function () { w.postMessage({ input: Array.prototype.slice.call(arguments) }); };
    w.postMessage({ start: true, file: file, canvas: off, search: location.search, cfg: { arguments: M1.arguments, nxEnv: M1.nxEnv, page: pg } }, [off]);
  } else { var s = document.createElement("script"); s.src = "em.js"; document.body.appendChild(s); }
  // input: the keyboard and the first controller, as the nxweb page maps them (web/main.ts): Z = A, X = B, C = X, V = Y,
  // Enter = Plus, Backspace = Minus, Q / E = L / R, arrows or WASD = left stick, IJKL = right stick; a controller in the
  // standard mapping. Sent to nn::hid (nxnative's hle_hid.c) when it changes.
  var BTN = { A: 1, B: 2, X: 4, Y: 8, LS: 16, RS: 32, L: 64, R: 128, ZL: 256, ZR: 512, Plus: 1024, Minus: 2048, Left: 4096, Up: 8192, Right: 16384, Down: 32768 };
  var KEY_BTN = { KeyZ: BTN.A, KeyX: BTN.B, KeyC: BTN.X, KeyV: BTN.Y, Enter: BTN.Plus, Backspace: BTN.Minus, KeyQ: BTN.L, KeyE: BTN.R };
  var PAD_BTN = [BTN.B, BTN.A, BTN.Y, BTN.X, BTN.L, BTN.R, BTN.ZL, BTN.ZR, BTN.Minus, BTN.Plus, BTN.LS, BTN.RS, BTN.Up, BTN.Down, BTN.Left, BTN.Right];
  var keys = new Set(), sentK = "", sentP = "";
  // A press is latched: a key stays down for at least 150 ms after its keydown even when the keyup came sooner (a tap
  // that began and ended between two of the game's HID samples was lost: at 20 frames a second most taps were).
  var downAt = {}, upLater = {}, LATCH_MS = 150;
  addEventListener("keydown", function (e) { if (e.target === $("fileinput")) return; if (!e.repeat) downAt[e.code] = performance.now(); if (upLater[e.code]) { clearTimeout(upLater[e.code]); upLater[e.code] = 0; } keys.add(e.code); if (KEY_BTN[e.code] || /^Arrow|^Key[WASDIJKL]$/.test(e.code)) e.preventDefault(); });
  addEventListener("keyup", function (e) { var c = e.code, left = LATCH_MS - (performance.now() - (downAt[c] || 0)); if (left <= 0) { keys.delete(c); return; }
    if (upLater[c]) clearTimeout(upLater[c]); upLater[c] = setTimeout(function () { upLater[c] = 0; keys.delete(c); }, left); });
  addEventListener("blur", function () { keys.clear(); for (var c in upLater) if (upLater[c]) { clearTimeout(upLater[c]); upLater[c] = 0; } });

    requestAnimationFrame(pollInput);
    var M = window.nxInputSink ? { _nx_input: window.nxInputSink } : window.Module; if (!M || !M._nx_input || (!window.nxInputSink && !globalThis.NXOWNER)) return;
    var ax = function (neg, pos) { return (pos.some(function (k) { return keys.has(k); }) ? 32767 : 0) - (neg.some(function (k) { return keys.has(k); }) ? 32767 : 0); };
    var b = 0; keys.forEach(function (k) { b |= KEY_BTN[k] || 0; });
    var k = [b, ax(["ArrowLeft", "KeyA"], ["ArrowRight", "KeyD"]), ax(["ArrowDown", "KeyS"], ["ArrowUp", "KeyW"]), ax(["KeyJ"], ["KeyL"]), ax(["KeyK"], ["KeyI"])];
    if (k.join() !== sentK) { sentK = k.join(); M._nx_input(0, k[0], k[1], k[2], k[3], k[4]); }

    if (gp) { gp.buttons.forEach(function (x, i) { if (x.pressed && PAD_BTN[i]) p[0] |= PAD_BTN[i]; });

}
</script>
